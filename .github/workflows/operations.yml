name: Operations checks
on:
  pull_request:
    paths: ["operations/**", ".github/workflows/operations.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noorly_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: noorly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: operations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: operations/package-lock.json
      - run: npm ci
      - name: Install matching PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - run: npm run typecheck
      - name: Check backup recovery behavior
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'
      - run: npm test
        env:
          OPS_TEST_DATABASE_URL: postgres://noorly_test:local-ci-only@localhost:5432/noorly_test
          OPS_TEST_PG_BIN: /usr/lib/postgresql/16/bin
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
